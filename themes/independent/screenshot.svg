<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img"
     aria-label="Independent theme preview">
  <defs>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a8b99"/>
      <stop offset="100%" stop-color="#3d4a55"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="50%" stop-color="rgba(0,0,0,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.65)"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#ffffff"/>

  <!-- cover image with its scrim, and the title sitting on top of it -->
  <rect width="400" height="150" fill="url(#photo)"/>
  <rect width="400" height="150" fill="url(#scrim)"/>
  <circle cx="26" cy="26" r="11" fill="rgba(255,255,255,0.92)"/>
  <text x="40" y="112" fill="#ffffff" font-family="PT Sans, Helvetica, sans-serif" font-size="26"
        font-weight="700" letter-spacing="-0.5">Kantan Dev</text>
  <text x="40" y="132" fill="rgba(255,255,255,0.73)" font-family="PT Sans, Helvetica, sans-serif"
        font-size="10">Marvs · in AI · 1,337 Words</text>

  <!-- the reading column below it -->
  <g fill="#383838">
    <rect x="40" y="176" width="320" height="7" rx="3" opacity="0.75"/>
    <rect x="40" y="191" width="320" height="7" rx="3" opacity="0.75"/>
    <rect x="40" y="206" width="238" height="7" rx="3" opacity="0.75"/>
  </g>
  <rect x="40" y="228" width="120" height="9" rx="3" fill="#333332"/>
  <g fill="#383838">
    <rect x="40" y="250" width="320" height="7" rx="3" opacity="0.75"/>
    <rect x="40" y="265" width="280" height="7" rx="3" opacity="0.75"/>
  </g>
</svg>
