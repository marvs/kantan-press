<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32" role="img" aria-label="Kantan Press">
  <!-- A stoa: the public colonnade anyone could stand up and speak under.
       Drawn on a 32-unit grid with nothing thinner than 4.4 units, so every
       bar still holds 2 physical pixels when the browser renders this at
       16px. That constraint is why there is no fluting, no pediment and no
       gradient — all three disappear at tab size. -->
  <rect width="32" height="32" rx="6" fill="#57ad68"/>
  <g fill="#ffffff">
    <rect x="4" y="6" width="24" height="4.4" rx="0.7"/>
    <rect x="7.6" y="12" width="4.6" height="9.6"/>
    <rect x="19.8" y="12" width="4.6" height="9.6"/>
    <rect x="3" y="21.6" width="26" height="4.4" rx="0.7"/>
  </g>
</svg>
